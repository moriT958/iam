server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # mirrors public/_headers, which only applies on Cloudflare Pages
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, s-maxage=86400, stale-while-revalidate=86400" always;
    }

    location ~ ^/(_astro|fonts|images)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/favicon\. {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
